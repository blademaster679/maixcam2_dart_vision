# Clip 13 RGB replay tuning; independent-scene and board NV21 validation pending.
# Keep original full180 profile as baseline. Not calibrated for control.
# EXPERIMENTAL full180 business profile: isolated business_capture only.
# No measured calibration. Numeric camera fields below are pixel normalization
# for tracking only; this entry point ALWAYS invalidates angles, pose and control.
# VIN exposure/WB uses Camera-equivalent ISP calls and checked readback.
# 500us/WB below are an engineering start, pending the competition lens scan.
# MaixCAM2 dart target detector v0.2 configuration.
# These are safe engineering defaults, not final competition calibration.
# Measure camera intrinsics, physical target dimensions, exposure and WB on
# the competition camera before enabling pose or NPU-required control.

camera.width=1344
camera.height=760
camera.fps=180
camera.buffer_count=4
camera.warmup_frames=30

# Exposure sweep to validate: 100/200/400/800/1600 us. Start at 500 us and
# keep motion blur under 1.5 px while preserving the 25 m lamp.
camera.exposure_us=500
camera.gain=0

# CALIBRATE these gains after the camera has warmed up.
camera.manual_white_balance=true
camera.white_balance_gain=0.0682,0,0,0.04897

# MaixCDK RGB888 LAB ranges: L 0..100, A/B -128..127.
# The narrow core catches the saturated white center. The halo excludes the
# cyan walls/floor by requiring positive LAB B.
lab.core=90,100,-20,15,-20,35
lab.halo=10,100,-100,-5,3,127

detector.min_candidate_score=0.42
detector.min_tracking_score=0.36
detector.min_density=0.02
detector.min_green_dominance=0.06
detector.min_local_contrast=-0.04
# Keep acquisition strict. A confirmed, strongly associated track may use the
# lower floor when a bright mechanism makes the green lamp locally darker.
detector.min_tracking_local_contrast=-0.08
detector.contrast_relax_min_association=0.75
detector.min_halo_size_px=2.5
detector.core_center_max_fraction=0.65
detector.center_prior_radius_px=80
detector.initial_size_reference_px=12
detector.enable_saturated_core_candidates=true
detector.min_core_brightness=0.88
detector.min_core_ring_green_dominance=0.06
detector.min_core_ring_green_fraction=0.20
detector.core_ring_scale=0.35
detector.min_core_size_px=3

score.weight_color=0.20
score.weight_contrast=0.25
score.weight_density=0.10
score.weight_shape=0.10
score.weight_core=0.20
score.weight_temporal=0.30
score.weight_center_prior=0
score.weight_initial_size=0
score.weight_core_size=0.25

tracking.confirm_window=5
tracking.confirm_hits=3
tracking.max_missed_frames=5
# Bridge brief LAB-mask dropouts after a confirmed track. Predicted output is
# explicitly marked and expires by time as well as by max_missed_frames.
tracking.prediction_max_age_ms=110
tracking.confirmation_gate_px=19
tracking.gate_min_px=21
tracking.gate_max_px=45
tracking.gate_size_factor=2.0
tracking.max_log_size_jump=1.0
tracking.max_cross_source_log_size_jump=2.0
tracking.min_association_score=0.05

kalman.process_position=20
kalman.process_velocity=100
kalman.process_log_size=0.6
kalman.process_size_rate=2
kalman.measurement_position=4
kalman.measurement_log_size=0.08

sampling.grid=20
sampling.ring_margin_px=4
sampling.merge_margin_px=2
sampling.merge_blobs=false

# CALIBRATE: provisional full180 pixel-normalization values, not measured intrinsics.
# Run a native 1344x760 full180 calibration on the competition camera before control.
calibration.fx=1344
calibration.fy=1344
calibration.principal_x=672
calibration.principal_y=380
calibration.k1=0
calibration.k2=0
calibration.p1=0
calibration.p2=0
calibration.k3=0

# The isolated business pipeline schedules green/armor/search/motion at
# 90/60/30/30 Hz by default and emits predicted TargetEstimate records at 180 Hz.
# Experimental profiles override these stage rates; output rate is not direct
# observation rate. Intentional schedule skips do not consume the miss budget.
performance.classical_interval_frames=1
# The two legacy full-frame RGB-to-LAB blob passes cost about 75 ms at
# 640x480 on the MaixCAM2. Production uses the normalized RGB path alone;
# change this to true only for legacy A/B diagnostics.
performance.legacy_lab_candidates_enabled=false
# One full-resolution color-response pass retains the strongest seed in each
# 4x4 tile; bounded multi-scale refinement then runs only around the globally
# strongest seeds. This retains tiny lamps without a dense five-scale scan.
performance.sparse_component_search_enabled=true
# Keep full-resolution sampling for tiny long-range lamps. Values 2-4 are
# available for diagnostic speed/recall trade-offs without changing the
# 1344x760 capture or original-coordinate output.
performance.multiscale_downsample=1
# These steps apply only to the optional legacy dense fallback. The production
# tile search always samples the color response at full resolution.
performance.multiscale_min_scan_step_px=2
performance.multiscale_tracking_min_scan_step_px=1
# Dense normalized-response search is only useful inside the control capture
# cone. Full-frame LAB blobs are still retained for out-of-cone diagnostics.
performance.multiscale_capture_cone_only=true
# Once locked, use a generous predicted ROI. Every 30 classical detections
# (about 1 s at the default cadence) refresh the entire capture cone; any real
# miss also returns immediately to the full cone.
performance.multiscale_tracking_roi_radius_px=72
performance.multiscale_full_refresh_interval=30

# High-recall normalized green search. Only candidates inside the calibrated
# cone may reach control.
multiscale.enabled=true
multiscale.diameters_px=2,4,8,16,32
multiscale.min_green_response=0.08
multiscale.min_inner_brightness=0.06
multiscale.min_contrast_z=-0.50
multiscale.min_tracking_contrast_z=-2.0
multiscale.brightness_weight=0.20
multiscale.max_candidates=5
capture.enabled=false
capture.cone_deg=6.5

# Prediction may still be reported after this budget, but is never control-safe.
control.prediction_max_frames=2
control.prediction_max_age_ms=35

# Set explicitly to the match color. "auto" is allowed for diagnostics only
# and forces safe_for_control=false.
armor.expected_color=red
armor.min_color_response=0.16
armor.min_brightness=0.50
armor.min_green_size_px=4
armor.min_component_pixels=2
armor.max_component_pixels=12000
armor.min_bar_length_px=1.5
armor.max_bar_length_px=135
armor.min_elongation=1.45
armor.max_pair_angle_deg=20
armor.min_length_ratio=0.50
armor.max_color_response_diff=0.35
armor.min_separation_to_length=0.8
armor.max_separation_to_length=6.0
armor.min_green_offset_to_length=0.55
armor.max_green_offset_to_length=5.0
armor.max_green_lateral_to_separation=0.75
armor.min_geometry_confidence=0.55
armor.required_pose_hits=3
armor.aim_blend_ms=100
armor.cache_max_age_ms=50

# Keep disabled until all three dimensions are measured from the 2026 target.
target_geometry.pose_enabled=false
target_geometry.bar_separation_m=0
target_geometry.bar_length_m=0
target_geometry.green_offset_m=0
target_geometry.max_reprojection_error_px=2
target_geometry.min_pose_separation_px=12

# Optional until a calibrated YOLO11n-Pose AX620E model is installed. When
# enabled, failure to load/validate the model makes output control-unsafe.
npu.enabled=false
npu.required=false
npu.model_path=models/dart_target_pose.mud
npu.input_size=256
npu.interval_ms=33
npu.search_candidates=3
npu.confidence_threshold=0.50
npu.keypoint_threshold=0.35
npu.min_roi_size_px=64
npu.max_roi_size_px=384
npu.roi_size_factor=8

visual_motion.enabled=true
# SEARCH/REACQUIRE needs the full CPU budget for rapid target capture. Start
# global visual-motion estimation only after the tracker has locked a target.
visual_motion.tracking_only=true
# The isolated business pipeline schedules motion compensation at 30 Hz while
# TargetEstimate generation remains 180 Hz. This grid fits the dual-core budget.
visual_motion.interval_frames=2
visual_motion.grid_width=48
visual_motion.grid_height=36
visual_motion.max_shift_px=2
visual_motion.max_rotation_deg=6
visual_motion.rotation_step_deg=2
visual_motion.min_response=0.20

debug.enabled=false
debug.directory=/tmp/dart_green_debug
# Per-frame JSON plus a terminal flush can throttle the camera loop. Production
# reports at 10 Hz and omits the verbose candidate array. For a short device
# profiling run, temporarily use 1 and true.
debug.json_log_every_n_frames=6
debug.log_candidates=false
debug.save_every_n_frames=0
debug.save_on_state_change=true
debug.save_failed_frames=false
# 0 means unlimited. Keep a finite value on the device.
debug.max_saved_frames=1000

# Clip 13 development profile: suppress dim green signs and bright yellow objects.
multiscale.min_peak_green=220
armor.max_pair_longitudinal_to_length=0.6
armor.max_separation_to_green_size=6
